<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GCS Télémétrie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f9; }
        #controls { width: 350px; padding: 20px; background: #2c3e50; color: white; box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        .card { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        h2 { font-size: 1.1rem; margin: 0 0 15px 0; border-bottom: 1px solid #5d6d7e; padding-bottom: 8px; }
        h3 { font-size: 0.95rem; margin: 0 0 10px 0; color: #ecf0f1; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
        .data-val { background: #1a252f; padding: 6px 4px; border-radius: 4px; font-family: monospace; color: #2ecc71; font-size: 0.9rem; }
        .data-label { font-size: 0.75rem; color: #bdc3c7; margin-bottom: 3px; }

        /* GPS double ligne */
        .gps-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .gps-tag { font-size: 0.7rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; min-width: 42px; text-align: center; }
        .gps-tag.raw { background: #e67e22; color: white; }
        .gps-tag.kal { background: #2980b9; color: white; }
        .gps-val { font-family: monospace; font-size: 0.82rem; color: #ecf0f1; }

        /* Kalman inputs */
        label { display: block; font-size: 0.82rem; color: #bdc3c7; margin-top: 10px; margin-bottom: 3px; }
        input[type=number] { width: 100%; padding: 7px; border-radius: 4px; border: 1px solid #5d6d7e; background: #1a252f; color: #ecf0f1; font-size: 0.9rem; box-sizing: border-box; }
        button { width: 100%; padding: 9px; margin-top: 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s; }
        .btn-send { background: #27ae60; color: white; }
        .btn-send:hover { background: #2ecc71; }
        .btn-send:disabled { background: #1a5c34; cursor: not-allowed; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-clear:hover { background: #c0392b; }

        /* Waypoint list */
        #waypoint-list { font-size: 0.8rem; max-height: 160px; overflow-y: auto; background: #1a252f; padding: 6px 8px; border-radius: 4px; margin-bottom: 10px; }
        .wp-item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #2c3e50; }
        .wp-item:last-child { border-bottom: none; }
        .wp-num { color: #3498db; font-weight: bold; min-width: 22px; }
        .wp-coords { flex: 1; color: #bdc3c7; }
        .wp-spd { color: #f39c12; font-weight: bold; min-width: 45px; text-align: right; }
        .wp-del { background: none; border: none; color: #e74c3c; cursor: pointer; padding: 0 3px; font-size: 1rem; width: auto; margin: 0; }
        .wp-empty { color: #7f8c8d; font-style: italic; text-align: center; padding: 10px 0; }

        #status { font-size: 0.85rem; color: #bdc3c7; margin-bottom: 15px; }
        #send-progress { display: none; font-size: 0.8rem; color: #f39c12; text-align: center; margin-top: 5px; }

        /* Speed popup */
        #speed-popup {
            display: none;
            position: fixed;
            z-index: 9999;
            background: #2c3e50;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            color: white;
        }
        #speed-popup h4 { margin: 0 0 8px 0; font-size: 0.9rem; color: #3498db; }
        #speed-popup .popup-coords { font-family: monospace; font-size: 0.75rem; color: #95a5a6; margin-bottom: 10px; }
        #speed-popup input { margin-bottom: 8px; }
        .popup-btns { display: flex; gap: 6px; }
        .popup-btns button { margin: 0; flex: 1; padding: 7px; font-size: 0.82rem; }
        .btn-cancel { background: #7f8c8d; color: white; }
        .btn-cancel:hover { background: #95a5a6; }

        /* Track legend */
        .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 0.75rem; color: #bdc3c7; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    </style>
</head>
<body>
<div id="controls">
    <h2>🛰️ GCS Navigation</h2>
    <div id="status">Connexion en cours…</div>

    <!-- ACCÉLÉRATION -->
    <div class="card">
        <h3>🚀 Accélération (m/s²)</h3>
        <div class="data-grid">
            <div><div class="data-label">X</div><div id="ax" class="data-val">0.00</div></div>
            <div><div class="data-label">Y</div><div id="ay" class="data-val">0.00</div></div>
            <div><div class="data-label">Z</div><div id="az" class="data-val">0.00</div></div>
        </div>
        <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.82rem; color:#bdc3c7;">Vitesse GPS</span>
            <span id="spd" style="font-family:monospace; font-size:1rem; color:#f39c12; font-weight:bold;">— m/s</span>
        </div>
    </div>
    

    <!-- POSITION GPS -->
    <div class="card">
        <h3>📍 Position GPS</h3>
        <div class="gps-row">
            <span class="gps-tag raw">BRUT</span>
            <span class="gps-val" id="gps-raw">—</span>
        </div>
        <div class="gps-row">
            <span class="gps-tag kal">KALMAN</span>
            <span class="gps-val" id="gps-kal">—</span>
        </div>
        <div class="legend">
            <span><span class="legend-dot" style="background:#e67e22"></span>GPS brut</span>
            <span><span class="legend-dot" style="background:#2980b9"></span>Kalman filtré</span>
        </div>
    </div>

    <!-- KALMAN -->
    <div class="card">
        <h3>🛠️ Filtre Kalman</h3>
        <label>Gain Q (Process Noise)</label>
        <input type="number" id="gainQ" step="0.0001" value="0.001">
        <button class="btn-send" onclick="sendParam('KQ', 'gainQ')">Mettre à jour Q</button>
        <label style="margin-top:12px;">Gain R (Sensor Noise)</label>
        <input type="number" id="gainR" step="0.0001" value="0.01">
        <button class="btn-send" onclick="sendParam('KR', 'gainR')">Mettre à jour R</button>
    </div>

    <!-- WAYPOINTS -->
    <div class="card">
        <h3>📍 Parcours</h3>
        <div id="waypoint-list"><div class="wp-empty">Cliquez sur la carte pour ajouter des points</div></div>
        <div id="send-progress">Envoi en cours…</div>
        <button class="btn-send" id="btn-send" onclick="sendWaypoints()">🚀 Envoyer le parcours</button>
        <button class="btn-clear" onclick="clearWaypoints()">Effacer tout</button>
    </div>
</div>

<div id="map"></div>

<!-- POPUP VITESSE -->
<div id="speed-popup">
    <h4>⚡ Vitesse au waypoint</h4>
    <div class="popup-coords" id="popup-coords"></div>
    <label>Vitesse désirée (m/s)</label>
    <input type="number" id="speed-input" min="0" max="20" step="0.1" value="1.0">
    <div class="popup-btns">
        <button class="btn-cancel" onclick="cancelPoint()">Annuler</button>
        <button class="btn-send" onclick="confirmPoint()">Ajouter ✓</button>
    </div>
</div>

<script>
    // ── CONFIG ──
    var brokerUrl  = "21f2976a53f440f5b67745ca8e8a14b9.s1.eu.hivemq.cloud";
    var mqttUser   = "esp32";
    var mqttPass   = "Esp32_Gps";
    var topicCmd   = "esp32/gps/command";
    var topicStatus = "esp32/gps/status/";

    // ── MAP ──
    var map = L.map('map').setView([43.115, 6.124], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var waypoints       = [];
    var waypointMarkers = [];
    var pendingPoint    = null;
    var mapCentered     = false;

    // Polylines
    var polyRoute    = L.polyline([], { color: '#e67e22', weight: 2.5, dashArray: '8 6' }).addTo(map);
    var polyToFirst  = L.polyline([], { color: '#2ecc71', weight: 1.5, dashArray: '5 5' }).addTo(map);
    var polyRawTrack = L.polyline([], { color: '#e67e22', weight: 1.5, opacity: 0.5 }).addTo(map);
    var polyKalTrack = L.polyline([], { color: '#2980b9', weight: 2,   opacity: 0.8 }).addTo(map);

    var rawTrackPts = [], kalTrackPts = [];
    var rawLat = 0, rawLng = 0, kalLat = 0, kalLng = 0;

    // Drone marker
    var droneIcon = L.divIcon({
        className: '',
        html: "<div style='background:#3498db;width:13px;height:13px;border-radius:50%;border:2px solid white;box-shadow:0 0 6px #3498db'></div>",
        iconSize: [13,13], iconAnchor: [6,6]
    });
    var droneMarker = L.marker([43.115, 6.124], { icon: droneIcon, zIndexOffset: 1000 }).addTo(map);
    var rawIcon = L.divIcon({
    className: '',
    html: "<div style='background:#e67e22;width:10px;height:10px;border-radius:50%;border:2px solid white;opacity:0.8'></div>",
    iconSize: [10,10], iconAnchor: [5,5]
});
var rawMarker = L.marker([43.115, 6.124], { icon: rawIcon, zIndexOffset: 999 }).addTo(map);
    // ── MAP CLICK ──
    map.on('click', function(e) {
        pendingPoint = { lat: e.latlng.lat, lng: e.latlng.lng };
        document.getElementById('popup-coords').textContent =
            e.latlng.lat.toFixed(6) + ',  ' + e.latlng.lng.toFixed(6);
        document.getElementById('speed-input').value = '1.0';
        showPopup(e.originalEvent.clientX, e.originalEvent.clientY);
    });

    function showPopup(x, y) {
        var popup = document.getElementById('speed-popup');
        popup.style.display = 'block';
        var pw = 220, ph = 180;
        var vw = window.innerWidth, vh = window.innerHeight;
        popup.style.left = Math.min(x + 12, vw - pw - 10) + 'px';
        popup.style.top  = Math.min(y + 12, vh - ph - 10) + 'px';
        setTimeout(function(){ document.getElementById('speed-input').focus(); }, 50);
    }

    document.getElementById('speed-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter')  confirmPoint();
        if (e.key === 'Escape') cancelPoint();
    });

    function confirmPoint() {
        if (!pendingPoint) return;
        var speed = parseFloat(document.getElementById('speed-input').value) || 1.0;
        waypoints.push({ lat: pendingPoint.lat, lng: pendingPoint.lng, speed: speed });
        pendingPoint = null;
        document.getElementById('speed-popup').style.display = 'none';
        renderWaypoints();
    }

    function cancelPoint() {
        pendingPoint = null;
        document.getElementById('speed-popup').style.display = 'none';
    }

    // ── RENDER ──
    function renderWaypoints() {
        waypointMarkers.forEach(function(m){ map.removeLayer(m); });
        waypointMarkers = [];

        waypoints.forEach(function(wp, i) {
            var icon = L.divIcon({
                className: '',
                html: "<div style='background:" + (i===0?'#2ecc71':'#e67e22') + ";color:#fff;font-weight:bold;font-size:10px;padding:2px 6px;border-radius:3px;white-space:nowrap'>" + (i+1) + " · " + wp.speed + "m/s</div>",
                iconAnchor: [0, 10]
            });
            waypointMarkers.push(L.marker([wp.lat, wp.lng], { icon: icon }).addTo(map));
        });

        polyRoute.setLatLngs(waypoints.map(function(w){ return [w.lat, w.lng]; }));
        renderList();
    }

    function renderList() {
        var el = document.getElementById('waypoint-list');
        if (waypoints.length === 0) {
            el.innerHTML = '<div class="wp-empty">Cliquez sur la carte pour ajouter des points</div>';
            return;
        }
        el.innerHTML = waypoints.map(function(wp, i) {
            return '<div class="wp-item">' +
                '<span class="wp-num">' + String(i+1).padStart(2,'0') + '</span>' +
                '<span class="wp-coords">' + wp.lat.toFixed(5) + ', ' + wp.lng.toFixed(5) + '</span>' +
                '<span class="wp-spd">' + wp.speed + 'm/s</span>' +
                '<button class="wp-del" onclick="removeWp(' + i + ')">×</button>' +
            '</div>';
        }).join('');
    }

    function removeWp(idx) {
        waypoints.splice(idx, 1);
        renderWaypoints();
    }

    function clearWaypoints() {
        waypoints = [];
        renderWaypoints();
    }

    // ── MQTT ──
    var client = new Paho.MQTT.Client(
        "wss://" + brokerUrl + ":8884/mqtt",
        "WebGCS_" + Math.floor(Math.random()*99999)
    );

    client.onConnectionLost = function(r) {
        document.getElementById('status').innerHTML = '🔴 Déconnecté — reconnexion…';
        setTimeout(connectMqtt, 3000);
    };

    client.onMessageArrived = function(msg) {
        var val   = parseFloat(msg.payloadString);
        var topic = msg.destinationName;
        var key   = topic.split('/').pop();

        if (key === 'AX') document.getElementById('ax').textContent = val.toFixed(3);
        if (key === 'AY') document.getElementById('ay').textContent = val.toFixed(3);
        if (key === 'AZ') document.getElementById('az').textContent = val.toFixed(3);

        if (key === 'LAT') { rawLat = val; updateGpsDisplay(); }
        if (key === 'LNG') { rawLng = val; updateGpsDisplay(); rawMarker.setLatLng([rawLat, rawLng]); }
        if (key === 'FLAT') { kalLat = val; updateGpsDisplay(); }
        if (key === 'FLNG') { kalLng = val; updateGpsDisplay(); updateDrone(kalLat, kalLng, true); }

        if (key === 'SPD') document.getElementById('spd').textContent = val.toFixed(2) + ' m/s';
    };

    function updateGpsDisplay() {
        document.getElementById('gps-raw').textContent = rawLat.toFixed(6) + ',  ' + rawLng.toFixed(6);
        document.getElementById('gps-kal').textContent = kalLat.toFixed(6) + ',  ' + kalLng.toFixed(6);
    }

function updateDrone(lat, lng, isKal) {
    if (lat === 0 && lng === 0) return;
    droneMarker.setLatLng([lat, lng]);
    if (!mapCentered) { map.setView([lat, lng], 18); mapCentered = true; }

    // Ligne drone → premier waypoint
    if (waypoints.length > 0) {
        polyToFirst.setLatLngs([[lat, lng], [waypoints[0].lat, waypoints[0].lng]]);
    } else {
        polyToFirst.setLatLngs([]);
    }

    if (isKal) {

    function connectMqtt() {
        client.connect({
            userName: mqttUser, password: mqttPass, useSSL: true,
            keepAliveInterval: 30,
            onSuccess: function() {
                document.getElementById('status').innerHTML = '🟢 Connecté au broker';
                client.subscribe(topicStatus + '#');
            },
            onFailure: function(e) {
                document.getElementById('status').innerHTML = '🔴 Erreur : ' + e.errorMessage;
                setTimeout(connectMqtt, 4000);
            }
        });
    }

    function sendParam(key, inputId) {
        var val = document.getElementById(inputId).value;
        var msg = new Paho.MQTT.Message(key + '=' + val);
        msg.destinationName = topicCmd;
        client.send(msg);
    }

    // ── ENVOI WAYPOINTS (avec délai anti-race condition) ──
    async function sendWaypoints() {
        if (waypoints.length === 0) return;
        var btn  = document.getElementById('btn-send');
        var prog = document.getElementById('send-progress');
        btn.disabled = true;
        prog.style.display = 'block';

        for (var i = 0; i < waypoints.length; i++) {
            prog.textContent = 'Envoi point ' + (i+1) + '/' + waypoints.length + '…';
            var wp = waypoints[i];

            var mLat = new Paho.MQTT.Message('WPLAT' + i + '=' + wp.lat.toFixed(8));
            mLat.destinationName = topicCmd;
            client.send(mLat);
            await delay(100);

            var mLng = new Paho.MQTT.Message('WPLNG' + i + '=' + wp.lng.toFixed(8));
            mLng.destinationName = topicCmd;
            client.send(mLng);
            await delay(100);

            var mSpd = new Paho.MQTT.Message('WPSPD' + i + '=' + wp.speed.toFixed(2));
            mSpd.destinationName = topicCmd;
            client.send(mSpd);
            await delay(100);
        }

        // WPCNT en dernier — déclenche le chargement côté ESP
        await delay(150);
        var mCnt = new Paho.MQTT.Message('WPCNT=' + waypoints.length);
        mCnt.destinationName = topicCmd;
        client.send(mCnt);

        prog.textContent = '✅ Parcours envoyé (' + waypoints.length + ' points)';
        setTimeout(function() {
            btn.disabled = false;
            prog.style.display = 'none';
        }, 2000);
    }

    function delay(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

    // ── BOOT ──
    connectMqtt();
</script>
</body>
</html>
